<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abyssal Namer</title>
    <link rel="stylesheet" href="namer.css">
</head>
<body>
    <div class="container">
        <h2 class="title">Invoke the Unspeakable</h2>
        
        <div class="slot-machine">
            <div class="slot-container">
                <button onclick="roll(0)">Roll</button>
                <div id="slot-0" class="slot-box">???</div>
            </div>
            <div class="slot-container">
                <button onclick="roll(1)">Roll</button>
                <div id="slot-1" class="slot-box">???</div>
            </div>
            <div class="slot-container">
                <button onclick="roll(2)">Roll</button>
                <div id="slot-2" class="slot-box">???</div>
            </div>
        </div>

        <button class="spin-all" onclick="rollAll()">SPIN ALL</button>

        <div class="result-area">
            <p>The Name Revealed:</p>
            <h1 id="final-name">--------</h1>
            <canvas id="sigilCanvas" width="200" height="200"></canvas>
        </div>
    </div>
    <script src="namer.js"></script>
</body>
</html>
